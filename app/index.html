<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xotira</title>
<meta name="description" content="Xotira — smart disk cleaner for Windows. Explains why your disk is full and frees space safely.">
<meta name="author" content="Humoyun Safarov">
<link rel="icon" type="image/png" sizes="256x256" href="assets/icon.png">
<meta name="theme-color" content="#08090c">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('xotira-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root{
  --bg:#08090c; --bg-2:#0c0e12; --card:#111419; --card-2:#161a20; --hover:#1a1f26; --line:#20262e; --line-2:#2b323b;
  --text:#ebeff4; --muted:#8e99a6; --dim:#5d6773;
  --accent:#c6f432; --accent-2:#b2e01c; --accent-ink:#0b0e04; --accent-soft:rgba(198,244,50,.11); --accent-text:#c6f432;
  --ok:#3ddc84; --warn:#ffb340; --bad:#ff5468; --info:#6aa8ff; --violet:#a78bfa;
  --ok-soft:rgba(61,220,132,.12); --warn-soft:rgba(255,179,64,.13); --bad-soft:rgba(255,84,104,.13); --violet-soft:rgba(167,139,250,.15); --info-soft:rgba(106,168,255,.13);
  --r:20px; --r-sm:12px;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 24px 48px -28px rgba(0,0,0,.75);
  --mix:80%; --tile-ink:#fff; --track:#1b2027;
  --font:'Manrope','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --display:'Unbounded','Manrope','Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f2ee; --bg-2:#e8eae4; --card:#ffffff; --card-2:#f7f8f4; --hover:#f1f3ed; --line:#e2e5dd; --line-2:#d3d7cd;
  --text:#121519; --muted:#5b6570; --dim:#8c949c;
  --accent-soft:rgba(110,150,0,.12); --accent-text:#4f7300;
  --ok:#11a457; --warn:#c27400; --bad:#df243a; --info:#2f6fe0; --violet:#7357ee;
  --shadow:0 1px 2px rgba(20,25,30,.04), 0 14px 34px -20px rgba(20,25,30,.22);
  --mix:46%; --tile-ink:#10140c; --track:#e7e9e3;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 14px/1.5 var(--font);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(1100px 520px at -8% -18%, var(--accent-soft), transparent 60%), radial-gradient(900px 440px at 108% -8%, var(--violet-soft), transparent 60%);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.92em;background:var(--line);padding:1px 6px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px} svg.i.lg{width:22px;height:22px}

/* ---------- top bar + global progress line */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left));
  background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;min-width:0}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand span{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.top .sp{flex:1}
.topline{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;opacity:0;transition:opacity .3s}
.topline.on{opacity:1}
.topline i{display:block;height:100%;width:0;background:linear-gradient(90deg,transparent,var(--accent));transition:width .6s ease;box-shadow:0 0 12px var(--accent)}
.topline.ind i{width:30%!important;animation:ind 1.3s ease-in-out infinite}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.off{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.pill.live{color:var(--accent-text);background:var(--accent-soft);border-color:transparent;cursor:pointer}
.pill.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--card-2);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s,opacity .15s,box-shadow .2s}
.btn:hover{background:var(--hover);border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:var(--accent-2);box-shadow:0 8px 24px -10px var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.danger:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--text);border-color:var(--line-2)}
.ib.danger:hover{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout */
.wrap{max-width:1340px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.drive{padding:24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;position:relative;overflow:hidden}
.drive::after{content:'';position:absolute;inset:auto -20% -60% 30%;height:260px;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.donut-wrap{position:relative;width:230px;height:230px;flex:none}
.donut{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.donut circle{fill:none;stroke-width:20}
.donut .trk{stroke:var(--track)}
.donut .seg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1),stroke-width .2s,opacity .2s;cursor:pointer;pointer-events:stroke}
.donut.hov .seg{opacity:.45}
.donut .seg:hover,.donut .seg.hl{opacity:1;stroke-width:26}
.d-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:44px}
.d-center b{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.d-center span{color:var(--muted);font-size:11.5px;font-weight:800;margin-top:7px;text-transform:uppercase;letter-spacing:.08em;line-height:1.3}
.d-center em{font-style:normal;font-size:12px;font-weight:700;margin-top:4px;color:var(--text);line-height:1.3}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.drive h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,48px);letter-spacing:-.035em;margin:8px 0 2px;line-height:1.02}
.drive h1 small{font-family:var(--font);font-size:15px;color:var(--muted);font-weight:700;letter-spacing:0;margin-left:6px}
.drive .sub{margin:0 0 14px;color:var(--muted);font-weight:600}
.health{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:12px;font-weight:650;font-size:13px;line-height:1.4}
.health.bad{background:var(--bad-soft);color:var(--bad)} .health.warn{background:var(--warn-soft);color:var(--warn)} .health.ok{background:var(--ok-soft);color:var(--ok)}
.health svg{margin-top:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--muted);font-weight:650}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:color .15s}
.legend span:hover,.legend span.hl{color:var(--text)}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend b{font-family:var(--mono);font-weight:600;color:var(--text)}
.drive-chips{display:flex;gap:6px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:5px;min-height:156px;position:relative;overflow:hidden}
.tile .t-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.tile .t-v{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.025em;line-height:1.15;margin-top:2px}
.tile .t-s{color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.4}
.tile .t-a{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.tile.accent{background:linear-gradient(160deg,var(--accent-soft),transparent 70%),var(--card);border-color:color-mix(in oklab,var(--accent) 30%,var(--line))}
.tile.accent .t-v{color:var(--accent-text)}
.tile.click{cursor:pointer;transition:border-color .15s,transform .15s}
.tile.click:hover{border-color:var(--line-2);transform:translateY(-2px)}
.scan-row{display:flex;align-items:center;gap:12px}
.mini-ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.mini-ring circle{fill:none;stroke-width:5}
.mini-ring .trk{stroke:var(--track)}
.mini-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s}
.spark{width:100%;height:46px;margin-top:auto;display:block}
.prog-line{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:4px}
.prog-line i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.prog-line.ind i{width:35%!important;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.scan-cur{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}

/* ---------- section titles */
.sec-title{display:flex;align-items:center;gap:10px;margin:30px 2px 12px;font-weight:800;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec-title .line{flex:1;height:1px;background:var(--line)}

/* ---------- diagnosis */
.diag-head{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center;position:relative;overflow:hidden}
.diag-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(19px,2.3vw,25px);letter-spacing:-.025em;line-height:1.3}
.diag-head h2 em{font-style:normal;color:var(--accent-text)}
.diag-head p{margin:8px 0 0;color:var(--muted);font-weight:600;line-height:1.55}
.wins{display:flex;flex-direction:column;gap:8px}
.wins .w-h{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;align-items:baseline}
.wins .w-h b{font-family:var(--display);font-size:20px;color:var(--accent-text);letter-spacing:-.02em;text-transform:none}
.win{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .12s}
.win:hover{border-color:var(--c,var(--line-2));transform:translateX(2px)}
.win i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.win span{flex:1;font-weight:650;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win b{font-family:var(--mono);font-weight:600}
.strip{display:flex;height:46px;border-radius:14px;overflow:hidden;margin:14px 0;background:var(--track);gap:2px}
.strip > div{position:relative;min-width:3px;background:var(--c);display:flex;align-items:center;padding:0 10px;overflow:hidden;cursor:pointer;transition:filter .15s,flex-grow .6s;color:#0b0d10}
.strip > div:hover{filter:brightness(1.12)}
.strip > div span{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip > div.free{background:repeating-linear-gradient(135deg,var(--track) 0 7px,color-mix(in oklab,var(--track) 70%,var(--line-2)) 7px 14px);color:var(--muted)}
.strip > div.hid{background:repeating-linear-gradient(135deg,#4b5563 0 6px,#3b434f 6px 12px);color:#d5dae1}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.bcard{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.bcard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);opacity:.9}
.bcard::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--c) 22%,transparent),transparent);pointer-events:none}
.bcard:hover{border-color:color-mix(in oklab,var(--c) 45%,var(--line));transform:translateY(-2px)}
.bc-h{display:flex;align-items:center;gap:11px}
.bc-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in oklab,var(--c) 15%,transparent);flex:none}
.bc-h b{display:block;font-size:15px;line-height:1.25}
.bc-h small{color:var(--muted);font-weight:700;font-size:12px}
.bc-z{margin-left:auto;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.bc-bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bc-bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tone{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;text-transform:uppercase;letter-spacing:.05em}
.tone.ok{background:var(--ok-soft);color:var(--ok)} .tone.warn{background:var(--warn-soft);color:var(--warn)}
.tone.act{background:var(--accent-soft);color:var(--accent-text)} .tone.info{background:var(--line);color:var(--muted)}
.bc-t{margin:0;color:var(--muted);font-size:13px;line-height:1.55;font-weight:550}
.bc-t b{color:var(--text);font-weight:700}
.bc-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.bc-items li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:12.5px;cursor:pointer}
.bc-items li:hover{background:var(--hover)}
.bc-items li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bc-items li b{font-family:var(--mono);font-weight:600;color:var(--muted);flex:none}
.bc-cta{margin-top:auto;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:4px 0;font-weight:800;font-size:13px;color:var(--accent-text);cursor:pointer}
.bc-cta:hover{gap:9px}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--line),var(--line-2),var(--line));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- advice */
.advice{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.adv{padding:15px 16px;display:flex;gap:13px;align-items:flex-start;cursor:pointer;transition:border-color .15s,transform .15s}
.adv:hover{border-color:var(--line-2);transform:translateY(-2px)}
.adv .a-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--c-soft,var(--accent-soft));color:var(--c,var(--accent-text));flex:none}
.adv b{display:block;font-size:14.5px;line-height:1.35}
.adv p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
.adv .a-go{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--accent-text);display:inline-flex;gap:4px;align-items:center}

/* ---------- tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:28px -4px 0;padding:6px 4px;
  background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:750;cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{color:var(--text);background:var(--card)}
.tab.on{background:var(--card);color:var(--text);border-color:var(--line-2)}
.tab.on svg{color:var(--accent-text)}
.tab .cnt{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted)}
.tab .cnt.hot{background:var(--accent-soft);color:var(--accent-text)}
.panel{display:none;margin-top:12px}
.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 2px 14px}
.panel-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.panel-head p{margin:4px 0 0;color:var(--muted);font-weight:600;max-width:680px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- smart */
.sgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.sgroup{overflow:hidden}
.sg-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800}
.sg-h .sg-t{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:12.5px}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--hover)}
.srow.off{cursor:default;opacity:.62}
.srow .s-t{font-weight:750;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srow .s-d{color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.srow .s-n{color:var(--warn);font-size:12px;font-weight:650;margin-top:3px}
.srow .s-z{font-family:var(--mono);font-weight:600;text-align:right;min-width:78px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.badge.safe{background:var(--ok-soft);color:var(--ok)} .badge.care{background:var(--warn-soft);color:var(--warn)}
.badge.admin{background:var(--violet-soft);color:var(--violet)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.gray{background:var(--line);color:var(--muted)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
input[type=checkbox]{appearance:none;width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line-2);background:var(--card-2);display:grid;place-items:center;cursor:pointer;margin:0;transition:all .12s;flex:none}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:'';width:9px;height:5px;border:2.4px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
input[type=checkbox]:disabled{opacity:.4;cursor:not-allowed}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.tool{padding:16px;display:flex;flex-direction:column;gap:6px}
.tool .tl-h{display:flex;align-items:center;gap:10px;font-weight:800}
.tool .tl-h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--line);color:var(--text);flex:none}
.tool p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}
.tool .tl-z{font-family:var(--display);font-weight:700;font-size:20px;margin-top:2px}
.tool .tl-a{margin-top:auto;padding-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clean-note{margin:12px 2px 0;color:var(--dim);font-size:12.5px}
.stickybar{position:sticky;bottom:14px;z-index:15;margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;
  background:color-mix(in oklab,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line-2);box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.stickybar .sb-t{font-weight:700}
.stickybar .sb-t b{font-family:var(--display);color:var(--accent-text)}
.stickybar .sp{flex:1}

/* ---------- games */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.game{overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.game:hover{transform:translateY(-3px);border-color:var(--line-2)}
.g-cover{position:relative;aspect-ratio:16/7;background:linear-gradient(135deg,#2a1f3d,#14202b);overflow:hidden}
.g-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.game:hover .g-cover img{transform:scale(1.04)}
.g-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(5,6,8,.85))}
.g-cover .g-name{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;color:#fff;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.6);line-height:1.2}
.g-cover .g-badges{position:absolute;top:10px;left:10px;right:10px;z-index:1;display:flex;gap:6px;justify-content:space-between}
.g-cover .badge{backdrop-filter:blur(8px);background:rgba(10,12,15,.6);color:#e6ebf0}
.g-cover .badge.care{background:rgba(255,179,64,.88);color:#1a1205}
.g-cover .badge.bad{background:rgba(255,84,104,.9);color:#fff}
.g-cover .badge.live{background:rgba(198,244,50,.92);color:#0b0e04}
.g-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.g-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-stats div{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;min-width:0}
.g-stats small{display:block;color:var(--dim);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.g-stats b{display:block;font-family:var(--mono);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.g-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.g-sum .card{padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:150px;flex:1}
.g-sum small{color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.g-sum b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}

/* ---------- lists */
.list{overflow:hidden}
.lhead,.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 92px 104px 74px;grid-template-areas:"ck nm meta sz dt acts";gap:12px;align-items:center;padding:0 14px}
.lhead{height:38px;border-bottom:1px solid var(--line);color:var(--dim);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.lhead .sz,.lhead .dt{text-align:right}
.row{min-height:52px;border-bottom:1px solid var(--line);position:relative;transition:background .1s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft)}
.row .ck{grid-area:ck;display:grid;place-items:center;color:var(--dim)}
.row .nm{grid-area:nm;display:flex;align-items:center;gap:11px;min-width:0;padding:7px 0}
.row .nm .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in oklab,var(--c) 15%,transparent)}
.row .nm-t{min-width:0}
.row .nm-t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm-t small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm-t small.p{direction:rtl;text-align:left}
.row.dirrow .nm-t b{cursor:pointer}
.row.dirrow .nm-t b:hover{color:var(--accent-text)}
.row .meta{grid-area:meta;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.row .sz{grid-area:sz;text-align:right;font-family:var(--mono);font-weight:600}
.row .dt{grid-area:dt;text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap}
.row .acts{grid-area:acts;display:flex;justify-content:flex-end;gap:2px}
.row .pct{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);opacity:.75;border-radius:0 2px 2px 0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding:12px}

/* ---------- map */
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-weight:700;min-width:0}
.crumbs a{padding:5px 8px;border-radius:8px;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{background:var(--card);color:var(--text)}
.crumbs a:last-child{color:var(--text)}
.crumbs .s{color:var(--dim)}
.map-sum{color:var(--muted);font-weight:600;margin-top:4px}
.treemap{position:relative;height:min(46vh,460px);min-height:260px;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.tm{position:absolute;border:1.5px solid var(--bg);border-radius:7px;overflow:hidden;padding:7px 9px;cursor:pointer;color:var(--tile-ink);
  background:color-mix(in oklab,var(--c) var(--mix),var(--card));transition:filter .12s}
.tm:hover{filter:brightness(1.15) saturate(1.1)}
:root[data-theme="light"] .tm:hover{filter:brightness(.96)}
.tm b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tm span{display:block;font-family:var(--mono);font-size:11px;opacity:.82;white-space:nowrap}
.tm.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tm.f{background-image:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.04) 8px 16px)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--card-2);border:1px solid var(--line-2);border-radius:11px;padding:9px 12px;font-size:12.5px;max-width:340px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);display:none}
.tip b{display:block;word-break:break-all}
.tip .mono{color:var(--accent-text)}

/* ---------- filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--card);font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sel-in,.search{height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);padding:0 10px;font-weight:650;font-size:13px}
.search{min-width:200px;flex:1;max-width:320px}
.search:focus,.sel-in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent-2)}

/* ---------- types */
.types{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.tcat{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.tcat:last-child{border-bottom:0}
.tcat:hover{background:var(--hover)}
.tcat .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in oklab,var(--c) 15%,transparent)}
.tcat .bar{height:6px;border-radius:99px;background:var(--track);margin-top:7px;overflow:hidden}
.tcat .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.tcat small{color:var(--dim);font-size:11.5px}
.ext-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 90px;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.ext-row:last-child{border-bottom:0}
.ext-row .e{display:flex;align-items:center;gap:8px;font-weight:700}
.ext-row .e i{width:8px;height:8px;border-radius:3px;background:var(--c)}

/* ---------- dups / groups */
.dgroup{margin-bottom:12px;overflow:hidden}
.dg-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dg-h b{font-family:var(--mono)}
.dg-h .sp{flex:1}

/* ---------- progress tab */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.kpi b{font-family:var(--display);font-size:26px;letter-spacing:-.025em;line-height:1.15}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi.hero b{color:var(--accent-text)}
.chart-card{padding:18px 18px 10px;margin-bottom:14px}
.chart-card h3,.pcard h3{margin:0 0 4px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.chart-card p{margin:0 0 10px;color:var(--muted);font-size:12.5px;font-weight:600}
#chart{width:100%;height:240px;position:relative}
#chart svg{display:block;width:100%;height:100%;overflow:visible}
#chart .ax{fill:var(--dim);font:600 11px var(--mono)}
#chart .gl{stroke:var(--line);stroke-dasharray:3 5}
#chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
#chart .ev{fill:var(--card);stroke:var(--accent);stroke-width:2.5;cursor:pointer}
#chart .ev.del{stroke:var(--violet)}
#chart .evl{stroke:var(--accent);stroke-opacity:.35;stroke-dasharray:2 4}
#chart .now{fill:var(--accent)}
#chart .nowr{fill:var(--accent);opacity:.25;animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pcard{padding:18px}
.pcard > p{margin:0 0 12px;color:var(--muted);font-size:12.5px;font-weight:600}
.delta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.delta:last-child{border-bottom:0}
.delta:hover b{color:var(--accent-text)}
.delta b{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delta small{grid-column:1;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.delta .dv{grid-row:1/3;grid-column:2;font-family:var(--mono);font-weight:600;font-size:13.5px;text-align:right}
.delta .dv.up{color:var(--bad)} .delta .dv.down{color:var(--ok)}
.delta .db{grid-column:1/3;height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.delta .db i{display:block;height:100%;border-radius:99px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:'';position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;padding:8px 0;align-items:start;position:relative}
.tl .dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line-2);color:var(--c,var(--accent-text));z-index:1}
.tl b{display:block;font-size:13px;line-height:1.35}
.tl small{color:var(--dim);font-size:11.5px;font-weight:600}
.tl .v{font-family:var(--mono);font-weight:600;color:var(--accent-text);white-space:nowrap}

/* ---------- modal / live progress */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(4,6,8,.62);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.scrim.on{display:flex;animation:fade .18s}
.modal{width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal h3{margin:0 0 6px;font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.modal .m-body{color:var(--muted);font-weight:600}
.modal .m-body ul.plain{margin:10px 0;padding:0;list-style:none;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.modal .m-body ul.plain li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.modal .m-body ul.plain li:last-child{border-bottom:0}
.modal .m-body ul.plain li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.modal .m-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:13px;margin-top:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent-2);background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent-2)}
.opt b{color:var(--text);display:block}
.opt span{font-size:12.5px}
.big-total{font-family:var(--display);font-size:32px;color:var(--text);letter-spacing:-.03em;margin:6px 0 2px;line-height:1.1}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:11px;background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.infobox{margin-top:10px;padding:10px 12px;border-radius:11px;background:var(--info-soft);color:var(--info);font-size:12.5px}
.live{text-align:center;padding:6px 0 0}
.live-num{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.04em;color:var(--accent-text);line-height:1}
.live-sub{color:var(--muted);font-weight:700;margin-top:6px;font-size:13px}
.live .prog-line{height:8px;margin:16px 0 4px}
.live-items{list-style:none;margin:14px 0 0;padding:0;text-align:left;max-height:240px;overflow:auto}
.live-items li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
.live-items li:last-child{border-bottom:0}
.live-items li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.live-items li .mono{font-size:12px}
.live-items li.wait{opacity:.5}
.live-items li.done .mono{color:var(--accent-text)}
.st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.st.run{border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:rot .7s linear infinite}
.st.done{background:var(--accent);color:var(--accent-ink)}
.st.done svg{width:12px;height:12px;stroke-width:3}
.st.wait{border:2px dashed var(--line-2)}
.st.skip{background:var(--line);color:var(--muted)}
.live-cur{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;min-height:16px}
.done-box{text-align:center;position:relative;padding:10px 0 4px}
.done-box .ring{position:absolute;left:50%;top:38px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:burst 1.1s ease-out .1s}
@keyframes burst{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.done-box .live-num{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ba{display:grid;gap:8px;margin-top:16px;text-align:left}
.ba div{display:grid;grid-template-columns:70px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:12.5px;font-weight:700}
.ba .bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.ba .bar i{display:block;height:100%;border-radius:99px;background:var(--dim);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.ba .now .bar i{background:var(--accent)}
.ba .mono{text-align:right}
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{padding:12px 14px;border-radius:13px;background:var(--card-2);border:1px solid var(--line-2);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);font-weight:650;display:flex;gap:10px;align-items:flex-start;animation:fade .2s}
.toast.ok svg{color:var(--ok)} .toast.bad svg{color:var(--bad)} .toast.warn svg{color:var(--warn)}
.selbar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);z-index:70;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:16px;
  background:var(--text);color:var(--bg);box-shadow:0 24px 60px -20px rgba(0,0,0,.7);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 24px)}
.selbar.on{transform:translate(-50%,0)}
.selbar b{font-family:var(--display)}
.selbar .btn{height:36px}
.selbar .btn.ghost{color:var(--bg);border-color:color-mix(in oklab,var(--bg) 30%,transparent)}
.selbar .btn.ghost:hover{background:color-mix(in oklab,var(--bg) 12%,transparent)}
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-content:center;text-align:center;gap:10px;padding:20px}
.overlay.on{display:grid}
.overlay h2{font-family:var(--display);margin:0}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--accent);animation:rot .8s linear infinite;margin:0 auto 6px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- responsive */
@media (max-width:1060px){
  .hero{grid-template-columns:1fr}
  .types,.pgrid{grid-template-columns:1fr}
  .diag-head{grid-template-columns:1fr}
}
@media (max-width:720px){
  .wrap{padding-top:14px}
  .brand span{display:none}
  .drive{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px;padding:20px 16px}
  .drive .eyebrow,.drive .legend{justify-content:center}
  .drive .health{text-align:left}
  .donut-wrap{width:210px;height:210px}
  .tiles{gap:10px}
  .tile{min-height:140px;padding:14px}
  .lhead{display:none}
  .row{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"ck nm sz" "ck meta acts";row-gap:0;padding:6px 12px}
  .row .meta{justify-content:flex-start;padding-left:43px}
  .row .dt{display:none}
  .row .nm{padding:4px 0}
  .srow{grid-template-columns:24px minmax(0,1fr) auto;padding:12px 14px}
  .srow .s-btn{display:none}
  .stickybar{flex-wrap:wrap}
  .panel-head h2{font-size:18px}
  .selbar{left:12px;right:12px;transform:translateY(140%);border-radius:14px}
  .selbar.on{transform:none}
  .search{max-width:none}
  .strip{height:34px}
  .strip > div span{display:none}
  .diag-head{padding:18px}
  .live-num{font-size:36px}
}
@media (max-width:420px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile .t-v{font-size:19px}
  .top .btn span{display:none}
  .g-stats{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- additions: language switch, footer, demo badge, cover fallback */
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:12px;padding:4px 9px;border-radius:7px;cursor:pointer;letter-spacing:.04em}
.lang button.on{background:var(--text);color:var(--bg)}
.pill.demo{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.foot{margin-top:56px;padding:22px 2px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;color:var(--muted);font-size:12.5px;font-weight:650}
.foot a{color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.foot a:hover{color:var(--accent-text)}
.foot .brandline{display:flex;align-items:center;gap:10px;color:var(--text)}
.foot .brandline b{font-family:var(--display);letter-spacing:.02em}
.foot .sp{flex:1}
.g-cover .g-ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:64px;font-weight:700;color:rgba(255,255,255,.16);letter-spacing:-.04em;
  background:radial-gradient(120% 140% at 0% 0%,var(--gc1),transparent 60%),radial-gradient(120% 140% at 100% 100%,var(--gc2),transparent 60%),#15131c}
@media (max-width:720px){ .lang button{padding:4px 7px} .foot{flex-direction:column;align-items:flex-start}
  .top{gap:6px;padding-left:12px;padding-right:12px} .brand{flex:none} #adminPill{display:none} .pill.demo .dl{display:none} .top .btn.violet span{display:none} .top .btn.violet{padding:0 9px} }
@media (max-width:380px){ .brand b{display:none} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><img src="assets/icon.png" width="22" height="22" alt=""></div>
    <b>XOTIRA</b><span data-t="brandSub"></span>
  </div>
  <div class="sp"></div>
  <span id="demoPill" class="pill demo" style="display:none"><b>DEMO</b><span class="dl" data-t="demoPill"></span></span>
  <span id="livePill" class="pill live" style="display:none"></span>
  <span id="connPill" class="pill off" style="display:none" data-t="serverOff"></span>
  <span id="adminPill" class="pill"></span>
  <button class="btn sm violet" id="elevateBtn" style="display:none" data-tt="elevateTip"><svg class="i sm"><use href="#i-shield"/></svg><span data-t="fullAccess"></span></button>
  <div class="lang" id="langSw"><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
  <button class="ib" id="themeBtn" data-tt="themeTip"><svg class="i"><use href="#i-sun"/></svg></button>
  <div class="topline" id="topline"><i></i></div>
</header>

<main class="wrap">
  <section class="hero">
    <article class="card drive" id="driveCard">
      <div class="donut-wrap" id="donutWrap">
        <svg class="donut" id="donut" viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="80"/></svg>
        <div class="d-center" id="dCenter"><b>—</b><span data-t="loading"></span></div>
      </div>
      <div class="drive-meta" style="min-width:0;width:100%">
        <div class="eyebrow" id="driveEyebrow"></div>
        <h1 id="driveFree">—</h1>
        <p class="sub" id="driveSub"></p>
        <div class="health" id="driveHealth" style="display:none"></div>
        <div class="legend" id="driveLegend"></div>
      </div>
    </article>
    <div class="tiles">
      <article class="card tile accent click" data-go="smart">
        <div class="t-h"><svg class="i sm"><use href="#i-sparkles"/></svg><span data-t="tileSafe"></span></div>
        <div class="t-v" id="reclaimV">…</div>
        <div class="t-s" id="reclaimS"></div>
        <div class="t-a"><button class="btn sm primary" data-t="goClean"></button></div>
      </article>
      <article class="card tile" id="tileScan">
        <div class="t-h"><svg class="i sm"><use href="#i-hdd"/></svg><span data-t="tileScan"></span></div>
        <div class="scan-row">
          <svg class="mini-ring" viewBox="0 0 46 46" id="scanRing" style="display:none"><circle class="trk" cx="23" cy="23" r="19"/><circle class="fg" cx="23" cy="23" r="19" stroke-dasharray="0 120"/></svg>
          <div style="min-width:0"><div class="t-v" id="scanV">—</div><div class="t-s" id="scanS"></div></div>
        </div>
        <div class="scan-cur" id="scanCur"></div>
        <div class="t-a" id="scanActs"></div>
      </article>
      <article class="card tile" id="tileRecycle">
        <div class="t-h"><svg class="i sm"><use href="#i-trash"/></svg><span data-t="tileRecycle"></span></div>
        <div class="t-v" id="recV">—</div>
        <div class="t-s" id="recS"></div>
        <div class="t-a"><button class="btn sm" id="recBtn" data-t="empty"></button></div>
      </article>
      <article class="card tile click" data-go="progress">
        <div class="t-h"><svg class="i sm"><use href="#i-trend"/></svg><span data-t="tileProgress"></span></div>
        <div class="t-v" id="freedV">0 B</div>
        <div class="t-s" id="freedS"></div>
        <svg class="spark" id="spark" preserveAspectRatio="none"></svg>
      </article>
    </div>
  </section>

  <div class="sec-title"><svg class="i sm"><use href="#i-search"/></svg><span data-t="whyFull"></span><span class="line"></span></div>
  <section id="diag">
    <div class="card diag-head">
      <div><h2 id="diagTitle"><span class="skel" style="display:block;height:22px;width:80%"></span></h2><p id="diagSub"></p></div>
      <div class="wins" id="diagWins"></div>
    </div>
    <div class="strip" id="diagStrip"></div>
    <div class="bgrid" id="diagGrid"></div>
  </section>

  <div class="sec-title"><svg class="i sm"><use href="#i-zap"/></svg><span data-t="adviceTitle"></span><span class="line"></span></div>
  <section class="advice" id="advice"></section>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="smart"><svg class="i"><use href="#i-sparkles"/></svg><span data-t="tabSmart"></span></button>
    <button class="tab" data-tab="games"><svg class="i"><use href="#i-game"/></svg><span data-t="tabGames"></span><span class="cnt" id="gamesCnt" style="display:none"></span></button>
    <button class="tab" data-tab="map"><svg class="i"><use href="#i-grid"/></svg><span data-t="tabMap"></span></button>
    <button class="tab" data-tab="big"><svg class="i"><use href="#i-file"/></svg><span data-t="tabBig"></span></button>
    <button class="tab" data-tab="progress"><svg class="i"><use href="#i-trend"/></svg><span data-t="tabProgress"></span></button>
    <button class="tab" data-tab="types"><svg class="i"><use href="#i-layers"/></svg><span data-t="tabTypes"></span></button>
    <button class="tab" data-tab="dups"><svg class="i"><use href="#i-copy"/></svg><span data-t="tabDups"></span></button>
    <button class="tab" data-tab="dev"><svg class="i"><use href="#i-code"/></svg><span data-t="tabDev"></span></button>
    <button class="tab" data-tab="downloads"><svg class="i"><use href="#i-download"/></svg><span data-t="tabDownloads"></span></button>
    <button class="tab" data-tab="apps"><svg class="i"><use href="#i-package"/></svg><span data-t="tabApps"></span></button>
  </nav>

  <section class="panel on" data-panel="smart">
    <div class="panel-head">
      <div><h2 data-t="tabSmart"></h2><p data-t="smartLead"></p></div>
      <div class="head-actions"><button class="btn sm" id="smartRefresh"><svg class="i sm"><use href="#i-refresh"/></svg><span data-t="remeasure"></span></button></div>
    </div>
    <div class="sgroups" id="sgroups"></div>
    <div class="clean-note" id="cleanNote"></div>
    <div class="stickybar" id="smartBar">
      <div class="sb-t"><span data-t="selected"></span>: <b id="smartSelV">0 B</b> <span class="muted" id="smartSelN"></span></div>
      <div class="sp"></div>
      <button class="btn sm ghost" id="smartAll" data-t="selectSafe"></button>
      <button class="btn primary" id="smartClean"><svg class="i sm"><use href="#i-sparkles"/></svg><span data-t="clean"></span></button>
    </div>
    <div class="sec-title" id="toolsTitle" style="margin-top:30px"><svg class="i sm"><use href="#i-wrench"/></svg><span data-t="winTools"></span><span class="line"></span></div>
    <div class="tools" id="tools"></div>
  </section>

  <section class="panel" data-panel="games">
    <div class="panel-head">
      <div><h2 data-t="tabGames"></h2><p data-t="gamesLead"></p></div>
      <div class="head-actions"><button class="btn sm" id="gamesRefresh"><svg class="i sm"><use href="#i-refresh"/></svg><span data-t="refresh"></span></button></div>
    </div>
    <div class="g-sum" id="gSum"></div>
    <div class="ggrid" id="gGrid"></div>
  </section>

  <section class="panel" data-panel="map">
    <div class="panel-head">
      <div style="min-width:0"><div class="crumbs" id="crumbs"></div><div class="map-sum" id="mapSum"></div></div>
      <div class="head-actions">
        <button class="btn sm" id="mapUp"><svg class="i sm"><use href="#i-up"/></svg><span data-t="up"></span></button>
        <button class="btn sm" id="mapReveal"><svg class="i sm"><use href="#i-out"/></svg>Explorer</button>
        <button class="btn sm" id="mapScan"><svg class="i sm"><use href="#i-refresh"/></svg><span data-t="scanHere"></span></button>
      </div>
    </div>
    <div class="treemap" id="treemap"></div>
    <div class="card list" id="mapList"></div>
  </section>

  <section class="panel" data-panel="big">
    <div class="panel-head"><div><h2 data-t="tabBig"></h2><p id="bigSum"></p></div></div>
    <div class="filters" id="bigChips"></div>
    <div class="filters">
      <input class="search" id="bigQ" data-tp="bigSearch">
      <select class="sel-in" id="bigScope"><option value="user" data-t="scopeUser"></option><option value="all" data-t="scopeAll"></option></select>
      <select class="sel-in" id="bigAge"><option value="0" data-t="ageAny"></option><option value="-1" data-t="age24h"></option><option value="-7" data-t="age7d"></option><option value="90" data-t="age3m"></option><option value="180" data-t="age6m"></option><option value="365" data-t="age1y"></option><option value="730" data-t="age2y"></option></select>
      <select class="sel-in" id="bigMin"><option value="0">≥ 1 MB</option><option value="104857600">≥ 100 MB</option><option value="524288000">≥ 500 MB</option><option value="1073741824">≥ 1 GB</option><option value="5368709120">≥ 5 GB</option></select>
    </div>
    <div class="card list" id="bigList"></div>
  </section>

  <section class="panel" data-panel="progress">
    <div class="panel-head">
      <div><h2 data-t="tabProgress"></h2><p data-t="progLead"></p></div>
      <div class="head-actions"><button class="btn sm" id="progRefresh"><svg class="i sm"><use href="#i-refresh"/></svg><span data-t="refresh"></span></button></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card chart-card"><h3><svg class="i sm"><use href="#i-trend"/></svg><span data-t="chartTitle"></span></h3><p data-t="chartSub"></p><div id="chart"></div></div>
    <div class="pgrid">
      <div class="card pcard"><h3><svg class="i sm"><use href="#i-layers"/></svg><span data-t="whatChanged"></span></h3><p id="growSub"></p><div id="growth"></div></div>
      <div class="card pcard"><h3><svg class="i sm"><use href="#i-clock"/></svg><span data-t="history"></span></h3><p data-t="historySub"></p><ul class="tl" id="timeline"></ul></div>
    </div>
  </section>

  <section class="panel" data-panel="types">
    <div class="panel-head"><div><h2 data-t="tabTypes"></h2><p data-t="typesLead"></p></div></div>
    <div class="types"><div class="card list" id="typeCats"></div><div class="card list" id="typeExts"></div></div>
  </section>

  <section class="panel" data-panel="dups">
    <div class="panel-head">
      <div><h2 data-t="dupsTitle"></h2><p data-t="dupsLead"></p></div>
      <div class="head-actions"><button class="btn sm" id="dupSmart" style="display:none"><svg class="i sm"><use href="#i-zap"/></svg><span data-t="smartPick"></span></button><button class="btn primary sm" id="dupRun"><svg class="i sm"><use href="#i-search"/></svg><span data-t="findDups"></span></button></div>
    </div>
    <div id="dupBody"></div>
  </section>

  <section class="panel" data-panel="dev">
    <div class="panel-head">
      <div><h2 data-t="devTitle"></h2><p data-th="devLead"></p></div>
      <div class="head-actions"><button class="btn sm" id="devOld"><svg class="i sm"><use href="#i-zap"/></svg><span data-t="devOld"></span></button></div>
    </div>
    <div class="card list" id="devList"></div>
  </section>

  <section class="panel" data-panel="downloads">
    <div class="panel-head"><div><h2 data-t="dlTitle"></h2><p id="dlSum"></p></div>
      <div class="head-actions"><button class="btn sm" id="dlRefresh"><svg class="i sm"><use href="#i-refresh"/></svg><span data-t="refresh"></span></button></div></div>
    <div id="dlBody"></div>
  </section>

  <section class="panel" data-panel="apps">
    <div class="panel-head"><div><h2 data-t="appsTitle"></h2><p id="appSum"></p></div>
      <div class="head-actions"><input class="search" id="appQ" data-tp="appSearch"></div></div>
    <div class="card list" id="appList"></div>
  </section>

  <footer class="foot">
    <div class="brandline"><img src="assets/icon.png" width="26" height="26" alt=""><b>XOTIRA</b><span class="muted" id="footVer"></span></div>
    <span><span data-t="author"></span>: <b style="color:var(--text)">Humoyun Safarov</b></span>
    <a href="https://t.me/humoyunsafarov" target="_blank" rel="noopener"><svg class="i sm"><use href="#i-chat"/></svg>@humoyunsafarov</a>
    <a href="https://t.me/neyroai" target="_blank" rel="noopener"><svg class="i sm"><use href="#i-zap"/></svg><span data-t="channel"></span> @neyroai</a>
    <a id="repoLink" href="#" target="_blank" rel="noopener" style="display:none"><svg class="i sm"><use href="#i-code"/></svg>GitHub</a>
    <span class="sp"></span>
    <span data-t="privacyLine"></span>
  </footer>
</main>

<div class="selbar" id="selbar">
  <div><b id="selN">0</b> <span id="selWord"></span> · <span class="mono" id="selV">0 B</span></div>
  <button class="btn sm ghost" id="selClear" data-t="cancel"></button>
  <button class="btn sm danger" id="selDel"><svg class="i sm"><use href="#i-trash"/></svg><span data-t="deleteDots"></span></button>
</div>
<div class="scrim" id="scrim"><div class="card modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip"></div>
<div class="overlay" id="overlay"><div class="spin"></div><h2 data-t="ovTitle"></h2><p class="muted" id="ovS" data-t="ovSub"></p></div>

  if (e.key === 'Backspace' && S.tab === 'map' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !$('#scrim').classList.contains('on')) { e.preventDefault(); mapUp(); }
});
const barHTML = p => `<div class="prog-line ${p == null ? 'ind' : ''}"><i style="width:${Math.round((p || 0) * 100)}%"></i></div>`;

async function runJob(url, body, title, render) {
  const j = await api.post(url, body);
  if (!j || j.error) { toast(esc(tx(j?.error) || t('error')), 'bad'); return null; }
  const m = $('#modal');
  delete m.dataset.busy;
  openModal(title, render ? render(j) : barHTML(null), []);
  m.dataset.busy = '1';
  S.jobRunning = j; updTopline();
  let s = j;
  while (s.state === 'running') {
    await sleep(400);
    try { s = await api.get('/api/job?id=' + j.id); } catch (e) { continue; }
    S.jobRunning = s; updTopline();
    if (render) liveUpdate(s, render); else setModalBody(barHTML(s.progress) + `<p class="muted" style="margin:10px 0 0;font-size:12.5px">${esc(tx(s.msg))}</p>`);
  }
  delete m.dataset.busy;
  S.jobRunning = null; updTopline();
  return s;
}
function liveUpdate(s, render) {
  const prev = $('#liveNum');
  const prevV = prev ? (prev._v ?? +prev.dataset.v) : null;
  setModalBody(render(s));
  const n2 = $('#liveNum');
  if (n2 && prevV != null && !n2.dataset.raw) { n2._v = prevV; countTo(n2, +n2.dataset.v, fmt, 380); }
}
const stIcon = st => st === 'run' ? '<span class="st run"></span>' : st === 'done' ? `<span class="st done">${ic('tick')}</span>` : st === 'skip' || st === 'error' ? `<span class="st skip">${ic('x', 'sm')}</span>` : '<span class="st wait"></span>';
function renderCleanLive(j) {

    ${barHTML(j.progress)}

    <div class="live-cur">${esc(L.current ? '\u200E' + L.current + '\u200E' : tx(j.msg))}</div></div>`;

function renderDeleteLive(j) {

function doneHTML(freed, before, after, total, extra = '') {

function growBars() { requestAnimationFrame(() => setTimeout(() => $$('.ba [data-w]').forEach(i => i.style.width = i.dataset.w + '%'), 60)); }

/* ================================================================ selection + delete */
function setSel(path, size, on) {
  if (on) S.sel.set(path, size || 0); else S.sel.delete(path);
  $$(`[data-selrow="${CSS.escape(path)}"]`).forEach(r => r.classList.toggle('sel', on));
  $$(`.tm[data-path="${CSS.escape(path)}"]`).forEach(r => r.classList.toggle('sel', on));
  $$(`.selbox[data-path="${CSS.escape(path)}"]`).forEach(c => c.checked = on);
  updSelbar();
}
function updSelbar() {
  const n = S.sel.size; let tt = 0; for (const v of S.sel.values()) tt += v;
  $('#selN').textContent = n; $('#selV').textContent = fmt(tt); $('#selWord').textContent = t('selItems', { n });
  $('#selbar').classList.toggle('on', n > 0);
}
document.addEventListener('change', e => { const c = e.target; if (c.classList.contains('selbox')) setSel(c.dataset.path, +c.dataset.size, c.checked); });
$('#selClear').onclick = () => { [...S.sel.keys()].forEach(p => setSel(p, 0, false)); };
$('#selDel').onclick = () => confirmDelete([...S.sel.keys()]);

function confirmDelete(paths) {
  if (!paths.length) return;
  let total = 0; paths.forEach(p => total += S.sel.get(p) || 0);
  const risky = paths.filter(p => /\\AppData\\|\\ProgramData\\/i.test(p));
  const list = paths.slice(0, 40).map(p => `<li><span title="${esc(p)}">${esc(base(p))}</span><span class="mono">${fmt(S.sel.get(p))}</span></li>`).join('');
  openModal(t('delTitle', { n: paths.length }),
    `<div class="big-total">${fmt(total)}</div>
     <ul class="plain">${list}${paths.length > 40 ? `<li><span>${t('more', { n: paths.length - 40 })}</span><span></span></li>` : ''}</ul>
     <label class="opt"><input type="radio" name="dm" value="recycle" checked><div><b>${t('toRecycle')}</b><span>${t('toRecycleSub')}</span></div></label>
     <label class="opt"><input type="radio" name="dm" value="permanent"><div><b>${t('permanent')}</b><span>${t('permanentSub')}</span></div></label>
     ${risky.length ? `<div class="warnbox">${ic('alert', 'sm')} ${t('riskyApp', { n: risky.length })}</div>` : ''}`,
    [{ label: t('cancel'), cls: 'ghost' }, {
      label: ic('trash', 'sm') + t('delete'), cls: 'danger', fn: async () => {
        const mode = $('input[name=dm]:checked').value;
        const s = await runJob('/api/delete', { paths, mode }, mode === 'recycle' ? t('movingRecycle') : t('deleting'), renderDeleteLive);
        if (!s) return closeModal();
        const r = s.result || { ok: [], fail: [] };
        r.ok.forEach(o => setSel(o.path, 0, false));
        const failHTML = r.fail.length ? `<p style="margin:14px 0 0">${t('skippedN', { n: r.fail.length })}</p><ul class="plain">${r.fail.slice(0, 30).map(f => `<li><span title="${esc(f.path)}">${esc(base(f.path))}</span><span style="color:var(--warn)">${esc(tx(f.error))}</span></li>`).join('')}</ul>` : '';
        if (s.state !== 'done') { openModal(t('error'), `<p>${esc(tx(s.msg))}</p>`, [{ label: t('close'), cls: 'primary' }]); return; }
        if (mode === 'recycle') {
          openModal(t('movedTitle'), `<div class="big-total">${fmt(r.bytes)}</div>${t('movedN', { n: r.ok.length })}${failHTML}
            ${r.bytes > 0 ? `<div class="infobox">${t('emptyToFree')}</div>` : ''}`,
            r.bytes > 0 ? [{ label: t('later'), cls: 'ghost' }, { label: t('ttlRecycle'), cls: 'primary', fn: () => cleanTargets(['recycle']) }] : [{ label: t('close'), cls: 'primary' }]);
        } else {
          openModal(t('ready'), doneHTML(r.bytes, r.free_before, r.free_after) + failHTML, [{ label: t('great'), cls: 'primary' }]);
          growBars();
        }
        afterChange();
      }
    }]);
}

function sysDrive() { const d = S.info?.drives || []; return d.find(x => x.system) || d[0]; }

function renderDonut() {
  const d = sysDrive(); if (!d) return;
  const svg = $('#donut'), R = 80, C = 2 * Math.PI * R, gap = 1.6;
  let segs;
  if (S.bd?.buckets?.length) segs = S.bd.buckets.filter(b => b.size > d.total * 0.002).map(b => ({ id: b.id, size: b.size, c: BK[b.id]?.c || '#888', l: bl(b.id) }));
  else segs = [{ id: 'used', size: d.used, c: d.free / d.total < 0.1 ? 'var(--bad)' : d.free / d.total < 0.2 ? 'var(--warn)' : 'var(--accent)', l: t('usedLbl') }];
  const old = $$('.seg', svg);
  if (old.length !== segs.length || old.some((o, k) => o.dataset.b !== segs[k].id)) {
    old.forEach(o => o.remove());
    segs.forEach(s => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', 100); c.setAttribute('cy', 100); c.setAttribute('r', R); c.setAttribute('class', 'seg');
      c.dataset.b = s.id; c.setAttribute('stroke-dasharray', `0 ${C}`);
      svg.appendChild(c);
    });
  }
  let off = 0;
  const els = $$('.seg', svg);
  requestAnimationFrame(() => segs.forEach((s, k) => {
    const len = Math.max(0, s.size / d.total * C - gap);
    els[k].style.stroke = s.c;
    els[k].setAttribute('stroke-dasharray', `${len} ${C - len}`);
    els[k].setAttribute('stroke-dashoffset', -off);
    off += s.size / d.total * C;
  }));
  svg._segs = segs;
  donutCenter();
  const L = $('#driveLegend');
  if (S.bd?.buckets?.length) L.innerHTML = segs.slice(0, 7).map(s => `<span data-b="${s.id}" style="--c:${s.c}"><i></i>${esc(s.l)} <b>${fmt(s.size)}</b></span>`).join('');
  else L.innerHTML = `<span style="--c:var(--dim)"><i></i>${t('legendWait')}</span>`;
}
function donutCenter(hl) {
  const d = sysDrive(); if (!d) return;
  const box = $('#dCenter');
  if (hl) { box.innerHTML = `<b>${fmt(hl.size)}</b><span>${t('diskPct', { p: pct(hl.size, d.total) })}</span><em>${esc(hl.l)}</em>`; return; }
  box.innerHTML = `<b>${Math.round(d.free / d.total * 100)}%</b><span>${t('free')}</span><em>${fmt(d.free)}</em>`;

function hlBucket(id, on) {
  $('#donut').classList.toggle('hov', !!on);
  $$('#donut .seg').forEach(s => s.classList.toggle('hl', on && s.dataset.b === id));
  $$('#driveLegend [data-b]').forEach(s => s.classList.toggle('hl', on && s.dataset.b === id));

$('#donut').addEventListener('mouseover', e => { const s = e.target.closest('.seg'); if (s) hlBucket(s.dataset.b, true); });
$('#donut').addEventListener('mouseout', e => { if (e.target.closest('.seg')) hlBucket(null, false); });
$('#donut').addEventListener('click', e => { const s = e.target.closest('.seg'); if (s && BK[s.dataset.b]) scrollToBucket(s.dataset.b); });
$('#driveLegend').addEventListener('mouseover', e => { const s = e.target.closest('[data-b]'); if (s) hlBucket(s.dataset.b, true); });
$('#driveLegend').addEventListener('mouseout', () => hlBucket(null, false));
$('#driveLegend').addEventListener('click', e => { const s = e.target.closest('[data-b]'); if (s) scrollToBucket(s.dataset.b); });
$('#driveCard').addEventListener('click', e => { const b = e.target.closest('[data-scan]'); if (b) startScan(b.dataset.scan); });
function scrollToBucket(id) {
  const c = $(`.bcard[data-b="${id}"]`); if (!c) return;
  c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  c.animate([{ boxShadow: '0 0 0 0 transparent' }, { boxShadow: `0 0 0 3px ${BK[id].c}` }, { boxShadow: '0 0 0 0 transparent' }], { duration: 1400 });
}
function scanPct(sc) {
  const d = sysDrive();
  if (!sc || !d || !/^[A-Z]:\\?$/i.test(sc.root) || sc.root[0].toUpperCase() !== d.letter) return null;
  return Math.min(0.99, sc.bytes / Math.max(1, d.used));
}
function renderScan(sc) {
  const acts = $('#scanActs'), ring = $('#scanRing');
  if (!sc) { $('#scanV').textContent = t('notScanned'); acts.innerHTML = `<button class="btn sm primary" data-scanbtn>${t('scanBtn')}</button>`; ring.style.display = 'none'; return; }
  if (sc.state === 'running') {
    const p = scanPct(sc), d = sysDrive();
    const rate = sc.elapsed > 1 ? sc.bytes / sc.elapsed : 0;
    const eta = p != null && rate > 0 ? Math.max(1, Math.round((d.used - sc.bytes) / rate)) : null;
    ring.style.display = '';
    ring.querySelector('.fg').setAttribute('stroke-dasharray', `${(p ?? 0.15) * 119.4} 120`);
    $('#scanV').textContent = p != null ? Math.round(p * 100) + '%' : fmt(sc.bytes);
    $('#scanS').textContent = t('scanRun', { f: num(sc.files), r: num(sc.rate), eta: eta ? t('etaLeft', { s: eta }) : '' });
    $('#scanCur').textContent = sc.current || '';
    acts.innerHTML = `<button class="btn sm" data-scancancel>${ic('stop', 'sm')}${t('stop')}</button>`;
  } else {
    ring.style.display = 'none';
    $('#scanV').textContent = sc.state === 'done' ? t('ready') : t('stopped');
    $('#scanS').textContent = t('scanDone', { f: num(sc.files), b: fmt(sc.bytes), s: Math.round(sc.elapsed), e: sc.errors ? t('noAccess', { n: num(sc.errors) }) : '' });
    $('#scanCur').textContent = '';
    acts.innerHTML = `<button class="btn sm" data-scanbtn="${esc(sc.root)}">${ic('refresh', 'sm')}${t('rescan')}</button>`;
  }
  updTopline();
}
$('#scanActs').addEventListener('click', e => {
  if (e.target.closest('[data-scancancel]')) return api.post('/api/scan/cancel');
  const b = e.target.closest('[data-scanbtn]'); if (b) startScan(b.dataset.scanbtn || undefined);
});
function updTopline() {
  const line = $('#topline'), pill = $('#livePill');
  const sc = S.status?.scan || S.info?.scan;
  const j = S.jobRunning;
  if (j) {
    line.classList.add('on'); line.classList.toggle('ind', j.progress == null);
    line.firstElementChild.style.width = Math.round((j.progress || 0) * 100) + '%';
    pill.style.display = ''; pill.textContent = j.kind === 'dups' ? t('pillDups') : t('pillClean');
  } else if (sc?.state === 'running') {
    const p = scanPct(sc);
    line.classList.add('on'); line.classList.toggle('ind', p == null);
    line.firstElementChild.style.width = Math.round((p || 0) * 100) + '%';
    pill.style.display = ''; pill.textContent = t('pillScan', { p: p != null ? Math.round(p * 100) + '%' : '…' });
  } else { line.classList.remove('on'); pill.style.display = 'none'; }
}
$('#livePill').onclick = () => $('#tileScan').scrollIntoView({ behavior: 'smooth', block: 'center' });
async function startScan(path) {

/* ================================================================ poll */
let pollN = 0;
async function poll() {
  let st;
  try { st = await api.get('/api/status'); setOnline(true); } catch (e) { setOnline(false); setTimeout(poll, 3000); return; }
  S.status = st; pollN++;
  const sc = st.scan;
  if (sc) renderScan(sc);
  const running = sc && sc.state === 'running';
  if (sc && S.lastScanState === 'running' && sc.state === 'done') {
    toast(t('scanFinished', { f: num(sc.files), b: fmt(sc.bytes), s: Math.round(sc.elapsed) }));
    onScanDone();
  } else if (running && pollN % 6 === 0) refreshTab(false);
  if (sc) S.lastScanState = sc.state;
  if (pollN % 12 === 0) loadInfo();
  if (pollN % 30 === 0) loadProgress();
  setTimeout(poll, running || st.jobs?.length ? 1000 : 3000);
}
async function onScanDone() {
  await Promise.all([loadTypes(), loadOverview(), loadGames()]);
  S.junk = null; S.dl = null;
  refreshTab(true);
  loadJunk().then(renderAll); loadDl().then(renderAll); loadInfo();
  setTimeout(loadProgress, 1500);
}
function renderAll() { renderDiag(); renderAdvice(); }
function renderEverything() {
  renderHero(); renderSmart(); renderGames(); renderAll(); updSelbar(); updTopline(); renderSpark();
  if (S.dups) renderDups(); else $('#dupBody').innerHTML = `<div class="card empty"><b>${t('dupsNotRun')}</b>${t('dupsNotRunSub')}</div>`;
  refreshTab(true);
}

  $$('.panel').forEach(p => p.classList.toggle('on', p.dataset.panel === tb));

function refreshTab(force) {
  const tb = S.tab;
  if (tb === 'map') loadMap(S.mapPath);
  else if (tb === 'big') loadBig();
  else if (tb === 'types') loadTypes().then(renderTypes);
  else if (tb === 'dev') loadJunk().then(renderDev);
  else if (tb === 'downloads') (force || !S.dl ? loadDl() : Promise.resolve()).then(renderDl);
  else if (tb === 'apps') (force || !S.apps ? loadApps() : Promise.resolve()).then(renderApps);
  else if (tb === 'games') loadGames();
  else if (tb === 'progress') loadProgress();
  else if (tb === 'smart' && force) renderSmart();
}

function bucketStory(b) {
  const I = S.info || {};
  const top = (n = 3) => b.items.slice(0, n).map(i => `<b>${esc(tx(i.name))}</b> (${fmt(i.size)})`).join(', ');
  const compOf = c => (b.comp.find(x => x[0] === c) || [0, 0])[1];
  const s = { tone: 'info', pill: t('pInfo'), text: '', cta: null, items: b.items };
  switch (b.id) {
    case 'games': {
      const G = (S.games || []).filter(g => g.size > 0);
      const unused = G.filter(g => !g.last_played || nowS() - g.last_played > 60 * DAY);
      const us = unused.reduce((a, g) => a + g.size, 0);
      const upd = G.find(g => g.updating);
      if (G.length) {
        s.items = G.slice(0, 4).map(g => ({ name: g.name, size: g.size, go: 'games' }));
        s.text = t('gText', { n: G.length, g: esc(G[0].name), s: fmt(G[0].size) }) + (unused.length ? t('gUnused', { n: unused.length, s: fmt(us) }) : t('gAllRecent')) + (upd ? t('gUpd', { g: esc(upd.name) }) : '');
      } else s.text = t('gFiles', { t: top() });
      if (us > 5 * GB) { s.tone = 'act'; s.pill = t('gPillFree', { s: fmt(us) }); } else { s.tone = 'info'; s.pill = t('gPillActive'); }
      s.cta = { l: t('gCta'), go: 'games' }; break;
    }
    case 'windows': {
      const pf = b.items.find(i => /pagefile\.sys$/i.test(i.path)), hb = b.items.find(i => /hiberfil\.sys$/i.test(i.path)), sx = b.items.find(i => /\\WinSxS$/i.test(i.path));

const OPENERS = ['cleanmgr', 'storagesense', 'winold', 'restore'];
function cleanTargets(ids) {
  const items = ids.map(id => S.smart?.items.find(x => x.id === id)).filter(Boolean);
  if (!items.length) return;
  const total = items.reduce((a, it) => a + (it.size || 0), 0);
  const one = items.length === 1 ? items[0] : null;
  const care = items.filter(it => it.risk === 'care');
  const opens = one && OPENERS.includes(one.id);
  const title = opens ? tx(one.title) : one?.id === 'recycle' ? t('ttlRecycle') : one?.id === 'hiber' ? t('ttlHiber') : one?.id === 'dism' ? t('ttlDism') : t('ttlN', { n: items.length });
  const go = async () => {
    const s = await runJob('/api/clean', { ids }, opens ? t('opening') : t('cleaning'), opens ? null : renderCleanLive);
    if (!s) return closeModal();
    const r = s.result || { items: [] };
    if (opens) { closeModal(); toast(t('opened', { t: esc(tx(one.title)) })); return; }
    if (s.state !== 'done') { openModal(t('error'), `<p>${esc(tx(s.msg))}</p>`, [{ label: t('close'), cls: 'primary' }]); return; }
    const skipped = (r.items || []).filter(x => x.skipped);
    const extra = (r.failed ? `<div class="infobox">${t('lockedFiles', { n: num(r.failed) })}</div>` : '') +
      (skipped.length ? `<div class="warnbox">${t('skippedAdmin', { n: skipped.length })}</div>` : '') +
      (r.freed >= 2 * GB ? `<div class="infobox">${ic('refresh', 'sm')} ${t('rescanning')}</div>` : '');
    openModal(t('ready'), doneHTML(r.freed, r.free_before, r.free_after, null, extra), [{ label: t('great'), cls: 'primary' }]);
    growBars();
    S.smartTouched = false; afterChange();
  };
  if (opens) return go();
  const list = items.map(it => `<li><span>${esc(tx(it.title))}</span><span class="mono">${it.size != null ? fmt(it.size) : '—'}</span></li>`).join('');
  const notes = care.filter(c => c.note).map(c => esc(tx(c.note))).join('. ');
  const extra = one?.id === 'recycle' ? `<div class="warnbox">${t('wRecycle', { n: num(one.count) })}</div>` :
    one?.id === 'hiber' ? `<div class="warnbox">${t('wHiberOff')}</div>` :
    one?.id === 'dism' ? `<div class="infobox">${t('wDism')}</div>` :

    `<p style="margin:10px 0 0;font-size:12.5px">${t('wDefault')}</p>`;
  openModal(title, `${total ? `<div class="big-total">${fmt(total)}</div>` : ''}<ul class="plain">${list}</ul>${extra}`,
    [{ label: t('cancel'), cls: 'ghost' }, { label: one?.id === 'recycle' ? t('empty') : one?.id === 'dism' ? t('start') : t('clean'), cls: one?.id === 'recycle' ? 'danger' : 'primary', fn: go }]);
}

function squarify(vals, x, y, w, h) {
  const total = vals.reduce((a, b) => a + b, 0); if (!total) return [];
  const sc = vals.map(v => v * w * h / total);
  const out = []; let i = 0;
  const worst = (row, s) => { let sum = 0, mx = 0, mn = Infinity; for (const v of row) { sum += v; mx = Math.max(mx, v); mn = Math.min(mn, v); } return Math.max(s * s * mx / (sum * sum), (sum * sum) / (s * s * mn)); };
  while (i < sc.length) {
    const s = Math.min(w, h); let row = [sc[i]], j = i + 1, wst = worst(row, s);
    while (j < sc.length) { const r2 = row.concat(sc[j]); const w2 = worst(r2, s); if (w2 > wst) break; row = r2; wst = w2; j++; }
    const sum = row.reduce((a, b) => a + b, 0);
    if (w >= h) { const cw = sum / h; let cy = y; for (const v of row) { const rh = v / cw; out.push({ x, y: cy, w: cw, h: rh }); cy += rh; } x += cw; w -= cw; }
    else { const rh = sum / w; let cx = x; for (const v of row) { const rw = v / rh; out.push({ x: cx, y, w: rw, h: rh }); cx += rw; } y += rh; h -= rh; }
    i = j;
  }
  return out;
}
