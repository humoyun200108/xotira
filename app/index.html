    <div><b>${esc(tx(m.l))}</b> <small>${t('nFilesExt', { n: num(c.count) })} · ${c.exts.slice(0, 4).map(e => esc(e.ext)).join(' ')}</small><div class="bar"><i style="width:${c.size / mx * 100}%"></i></div></div>
    <b class="mono">${fmt(c.size)}</b></div>`; }).join('');
  $('#typeExts').innerHTML = `<div class="lhead" style="grid-template-columns:minmax(0,1fr) 80px 90px;grid-template-areas:none;display:grid"><span>${t('colExt')}</span><span style="text-align:right">${t('colCount')}</span><span style="text-align:right">${t('colSize')}</span></div>` +
    T.exts.map(e => `<div class="ext-row" style="--c:${(CAT[e.cat] || CAT.other).c}"><span class="e"><i></i>${esc(e.ext)}</span><span class="mono dim" style="text-align:right">${num(e.count)}</span><span class="mono" style="text-align:right">${fmt(e.size)}</span></div>`).join('');
}
$('#typeCats').addEventListener('click', e => { const tc = e.target.closest('[data-tcat]'); if (!tc) return; S.big.cat = tc.dataset.tcat; S.big.scope = 'all'; $('#bigScope').value = 'all'; switchTab('big'); });

/* ================================================================ dups */
$('#dupRun').onclick = async () => {
  const s = await runJob('/api/dups', {}, t('dupsSearching'), j => `<div class="live"><div class="live-num" id="liveNum" data-raw="1" style="font-size:34px">${Math.round((j.progress || 0) * 100)}%</div><div class="live-sub">${esc(tx(j.msg) || t('preparing'))}</div>${barHTML(j.progress)}</div>`);
  closeModal();
  if (!s) return;
  if (s.state !== 'done') return toast(esc(tx(s.msg) || t('error')), 'bad');
  S.dups = s.result; renderDups(); renderAdvice();
};
function renderDups() {
  const D = S.dups; if (!D) return;
  $('#dupSmart').style.display = D.groups.length ? '' : 'none';
  if (!D.groups.length) { $('#dupBody').innerHTML = `<div class="card empty"><b>${t('dupsNone')}</b>${t('dupsNoneSub')}</div>`; return; }
  $('#dupBody').innerHTML = `<p class="muted" style="margin:0 2px 12px">${t('dupsSum', { n: num(D.total_groups), s: fmt(D.wasted) })}</p>` +
    D.groups.map(g => `<div class="card dgroup"><div class="dg-h"><span class="badge gray">${esc(cl(g.cat))}</span><b>${fmt(g.size)}</b><span class="muted">${t('copies', { n: g.files.length })}</span><span class="sp"></span><span class="muted">${t('extra')}: <b class="mono" style="color:var(--text)">${fmt(g.wasted)}</b></span>${g.sampled ? `<span class="badge gray" title="${esc(t('sampleTip'))}">${t('sample')}</span>` : ''}</div>` +
      g.files.map((f, fi) => rowHTML({ path: f.path, name: base(f.path), size: g.size, mtime: f.mtime, cat: g.cat, prot: f.prot }, { showPath: true, extraTag: fi === 0 ? `<span class="badge safe">${t('oldest')}</span>` : '' })).join('') + '</div>').join('');
}
$('#dupSmart').onclick = () => {
  for (const g of S.dups.groups) {
    const score = f => (/\\Downloads\\|\\Telegram Desktop\\|\\Temp\\/i.test(f.path) ? 1e12 : 0) + f.mtime;
    const keep = [...g.files].sort((a, b) => score(a) - score(b))[0];
    for (const f of g.files) if (f !== keep && !f.prot) setSel(f.path, g.size, true);
  }
  renderDups(); toast(t('dupsPicked'));
};

/* ================================================================ dev junk */
async function loadJunk() { try { S.junk = await api.get('/api/junk'); } catch (e) { } return S.junk; }
function renderDev() {
  const J = S.junk;
  if (!J?.scanned) { $('#devList').innerHTML = `<div class="empty"><b>${t('waitScan')}</b></div>`; return; }
  if (!J.items.length) { $('#devList').innerHTML = `<div class="empty"><b>${t('devNone')}</b>${t('devNoneSub')}</div>`; return; }
  $('#devList').innerHTML = `<div class="lhead"><span></span><span>${t('colProject')}</span><span></span><span class="sz">${t('colSize')}</span><span class="dt">${t('colLastWork')}</span><span></span></div>` +
    J.items.map(it => rowHTML({ ...it, name: base(it.project), dir: true }, { sub: it.path, subPath: true, extraTag: (nowS() - it.mtime) > 90 * DAY ? `<span class="badge care">${t('d90')}</span>` : '' })).join('');
}
$('#devOld').onclick = () => {
  if (!S.junk) return; let n = 0;
  for (const it of S.junk.items) if (!it.prot && (nowS() - it.mtime) > 90 * DAY) { setSel(it.path, it.size, true); n++; }
  renderDev(); toast(n ? t('devPicked', { n }) : t('devNoOld'), n ? 'ok' : 'warn');
};

/* ================================================================ downloads */
async function loadDl() { try { S.dl = await api.get('/api/downloads'); } catch (e) { } return S.dl; }
function renderDl() {
  const D = S.dl; if (!D) return;
  $('#dlSum').innerHTML = t('dlSum', { p: esc(D.path), n: num(D.count), s: fmt(D.total) });
  const G = [['installers', 'dlInst', 'dlInstSub', 'package'], ['extracted', 'dlExt', 'dlExtSub', 'archive'], ['videos', 'dlVids', 'dlVidsSub', 'film'], ['old', 'dlOld', 'dlOldSub', 'alert']];
  const html = G.map(([k, tk, dk, i]) => {
    const g = D.groups[k]; if (!g?.count) return '';
    return `<div class="card dgroup"><div class="dg-h">${ic(i)}<div><b style="font-family:var(--font)">${t(tk)}</b><div class="muted" style="font-size:12.5px">${t(dk)}</div></div><span class="sp"></span><b>${fmt(g.size)}</b><span class="muted">${num(g.count)}</span><button class="btn sm" data-dlall="${k}">${t('selectAll')}</button></div>` +
      g.items.map(it => rowHTML(it, { cat: true })).join('') + '</div>';
  }).join('');
  $('#dlBody').innerHTML = html || `<div class="card empty"><b>${t('dlClean')}</b>${t('dlCleanSub')}</div>`;
}
$('#dlBody').addEventListener('click', e => {
  const b = e.target.closest('[data-dlall]'); if (!b) return;
  S.dl.groups[b.dataset.dlall].items.forEach(it => setSel(it.path, it.size, true));
});
$('#dlRefresh').onclick = () => loadDl().then(() => { renderDl(); renderAll(); });

/* ================================================================ apps */
async function loadApps() {
  $('#appList').innerHTML = `<div class="empty">${t('appsLoading')}</div>`;
  try { S.apps = await api.get('/api/apps'); } catch (e) { return; }
}
function renderApps() {
  const A = S.apps; if (!A) return;
  const q = $('#appQ').value.trim().toLowerCase();
  const items = A.items.filter(a => !q || a.name.toLowerCase().includes(q) || (a.publisher || '').toLowerCase().includes(q));
  $('#appSum').textContent = t('appsSum', { n: A.items.length, s: fmt(A.total) });
  const mx = A.items[0]?.size || 1;
  $('#appList').innerHTML = items.map(a => `<div class="row"><div class="ck"></div>
    <div class="nm"><span class="ico" style="--c:var(--violet)">${ic('package', 'sm')}</span><div class="nm-t"><b title="${esc(a.location)}">${esc(a.name)}</b><small>${esc([a.publisher, a.version].filter(Boolean).join(' · '))}</small></div></div>
    <div class="meta">${a.src === 'scan' ? `<span class="badge safe" title="${esc(t('exactTip'))}">${t('exact')}</span>` : ''}</div>
    <div class="sz">${a.size ? fmt(a.size) : '<span class="dim">—</span>'}</div>
    <div class="dt">${esc(a.date)}</div>
    <div class="acts">${a.location ? `<button class="ib" data-act="reveal" data-path="${esc(a.location)}" title="${t('openFolder')}">${ic('out', 'sm')}</button>` : ''}<button class="ib danger" data-uninst="${esc(a.key)}" title="${t('uninstall')}">${ic('trash', 'sm')}</button></div>
    ${a.size ? `<i class="pct" style="width:${a.size / mx * 100}%;background:var(--violet)"></i>` : ''}</div>`).join('') || `<div class="empty"><b>${t('notFound')}</b></div>`;
}
$('#appQ').addEventListener('input', renderApps);
$('#appList').addEventListener('click', e => {
  const b = e.target.closest('[data-uninst]'); if (!b) return;
  const a = S.apps.items.find(x => x.key === b.dataset.uninst);
  openModal(t('uninstTitle', { a: esc(a.name) }), `${t('uninstBody')}${a.size ? `<div class="big-total">${fmt(a.size)}</div>` : ''}`,
    [{ label: t('cancel'), cls: 'ghost' }, { label: t('uninstOpen'), cls: 'danger', fn: async () => { closeModal(); const r = await api.post('/api/uninstall', { key: a.key }); r.error ? toast(esc(tx(r.error)), 'bad') : toast(t('uninstOpened')); setTimeout(() => S.tab === 'apps' && loadApps().then(renderApps), 15000); } }]);
});

/* ================================================================ advice */
function renderAdvice() {
  const A = [], I = S.info, sm = S.smart;
  if (sm) {
    const safe = smartSafeTotal();
    if (safe > 100 * MB) A.push({ s: safe, i: 'sparkles', tl: t('aCache', { s: fmt(safe) }), d: t('aCacheSub'), cta: t('clean'), go: 'smart' });
    const hib = sm.items.find(x => x.id === 'hiber');
    if (hib?.size > 2 * GB) A.push({ s: hib.size * 0.6, i: 'moon2', tl: t('aHiber', { s: fmt(hib.size) }), d: t('aHiberSub'), cta: t('look'), go: 'smart', c: 'var(--violet)' });
    const adm = sm.items.filter(x => x.kind === 'clean' && x.admin && x.exists);
    if (adm.length && !sm.admin) A.push({ s: 50 * MB, i: 'shield', tl: t('aAdmin'), d: t('aAdminSub', { n: adm.length }), cta: t('grant'), fn: elevate, c: 'var(--violet)' });
  }
  if (I?.recycle?.size > 100 * MB) A.push({ s: I.recycle.size, i: 'trash', tl: t('aRecycle', { s: fmt(I.recycle.size) }), d: t('aRecycleSub', { n: num(I.recycle.count) }), cta: t('empty'), fn: () => cleanTargets(['recycle']), c: 'var(--bad)' });
  const G = (S.games || []).filter(g => g.size > 0 && (!g.last_played || nowS() - g.last_played > 60 * DAY));
  const gs = G.reduce((a, g) => a + g.size, 0);
  if (gs > 2 * GB) A.push({ s: gs, i: 'game', tl: t('aGames', { n: G.length, s: fmt(gs) }), d: t('aGamesSub', { g: G.slice(0, 2).map(g => g.name).join(', ') }), cta: t('look'), go: 'games', c: BK.games.c });
  if (S.junk?.items) {
    const old = S.junk.items.filter(x => !x.prot && nowS() - x.mtime > 90 * DAY);
    const os = old.reduce((a, x) => a + x.size, 0);
    if (os > 300 * MB) A.push({ s: os, i: 'code', tl: t('aDev', { s: fmt(os) }), d: t('aDevSub', { n: old.length }), cta: t('look'), go: 'dev', c: 'var(--info)' });
  }
  if (S.dl?.groups) {
    const g = S.dl.groups, inst = g.installers.size + g.extracted.size;
    if (inst > 200 * MB) A.push({ s: inst, i: 'download', tl: t('aDl', { s: fmt(inst) }), d: t('aDlSub', { a: g.installers.count, b: g.extracted.count }), cta: t('look'), go: 'downloads', c: BK.downloads.c });
    if (g.videos.size > 5 * GB) A.push({ s: g.videos.size * 0.5, i: 'film', tl: t('aVid', { s: fmt(g.videos.size) }), d: t('aVidSub', { n: g.videos.count }), cta: t('look'), go: 'downloads', c: CAT.video.c });
  }
  if (S.dups?.wasted > 100 * MB) A.push({ s: S.dups.wasted, i: 'copy', tl: t('aDups', { s: fmt(S.dups.wasted) }), d: t('aDupsSub', { n: S.dups.total_groups }), cta: t('look'), go: 'dups', c: CAT.image.c });
  else if (!S.dups && (S.status?.scan || S.info?.scan)?.state === 'done') A.push({ s: 1, i: 'copy', tl: t('aCheckDups'), d: t('aCheckDupsSub'), cta: t('search'), go: 'dups', c: CAT.image.c });
  A.sort((a, b) => b.s - a.s);
  window._adv = A;
  $('#advice').innerHTML = A.length ? A.slice(0, 6).map((a, k) => `<div class="card adv" data-adv="${k}" style="${a.c ? `--c:${a.c};--c-soft:color-mix(in oklab,${a.c} 14%,transparent)` : ''}">
    <span class="a-ic">${ic(a.i)}</span><div><b>${a.tl}</b><p>${esc(a.d)}</p><span class="a-go">${a.cta} ${ic('right', 'sm')}</span></div></div>`).join('')
    : `<div class="card adv" style="cursor:default"><span class="a-ic">${ic('check')}</span><div><b>${t('noAdvice')}</b><p>${t('noAdviceSub')}</p></div></div>`;
}
$('#advice').addEventListener('click', e => {
  const c = e.target.closest('[data-adv]'); if (!c) return;
  const a = window._adv[+c.dataset.adv];
  if (a.fn) a.fn(); else goTab(a.go);
});

/* ================================================================ elevate */
async function elevate() {
  if (DEMO) return toast(t('demoAction'), 'warn');
  openModal(t('elevTitle'), t('elevBody'),
    [{ label: t('cancel'), cls: 'ghost' }, {
      label: ic('shield', 'sm') + t('continue'), cls: 'primary', fn: async () => {
        closeModal();
        $('#overlay').classList.add('on');
        let r; try { r = await api.post('/api/elevate'); } catch (e) { r = { ok: true }; }
        if (!r.ok) { $('#overlay').classList.remove('on'); return toast(esc(tx(r.error) || t('denied')), 'warn'); }
        $('#ovS').textContent = t('waitingServer');
        for (let i = 0; i < 90; i++) {
          await sleep(1000);
          try { const inf = await api.get('/api/info'); if (inf.admin) { location.reload(); return; } } catch (e) { }
        }
        $('#overlay').classList.remove('on'); toast(t('elevFail'), 'warn');
      }
    }]);
}
$('#elevateBtn').onclick = elevate;

/* ================================================================ theme / language / boot */
function setThemeIcon() { $('#themeBtn').innerHTML = ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'); }
$('#themeBtn').onclick = () => {
  const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = th; try { localStorage.setItem('xotira-theme', th); } catch (e) { }
  setThemeIcon(); drawTreemap(); drawChart();
};
$('#langSw').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b && b.dataset.lang !== LANG) setLang(b.dataset.lang); });
setThemeIcon();

function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
(async function boot() {
  applyStatic();
  if (REPO_URL) { $('#repoLink').href = REPO_URL; $('#repoLink').style.display = ''; }
  if (DEMO) { await loadScript('demo.js'); await window.XotiraDemo.ready; $('#demoPill').style.display = ''; }
  const q = new URLSearchParams(location.search);
  if (q.get('lang') === 'en' || q.get('lang') === 'uz') { LANG = q.get('lang'); applyStatic(); }
  if (q.get('theme')) { document.documentElement.dataset.theme = q.get('theme'); setThemeIcon(); }
  $('#dupBody').innerHTML = `<div class="card empty"><b>${t('dupsNotRun')}</b>${t('dupsNotRunSub')}</div>`;
  renderDiag();
  await loadInfo();
  S.lastScanState = S.info?.scan?.state || null;
  S.status = { scan: S.info?.scan };
  S.mapPath = S.info?.scan?.root || S.info?.sysdrive;
  loadSmart(); loadProgress(); loadGames();
  if (S.info?.scan?.state === 'done') onScanDone();
  else loadDl().then(renderAll);
  if (q.get('tab')) switchTab(q.get('tab'));
  poll();
})();

</script>
</body>
